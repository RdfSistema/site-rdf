name: PROD-DEPLOY

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lower: ${{ steps.meta.outputs.image_lower }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR must be lowercase)
        id: meta
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image_lower=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_lower }}:latest
            ${{ steps.meta.outputs.image_lower }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vm-deploy:
    name: Deploy on VM
    needs: build-and-push
    runs-on: [self-hosted, Linux, x64]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ""
    steps:
      - uses: actions/checkout@v4

      - name: Create env file and set image
        run: |
          echo '${{ secrets.PROD_ENV_FILE }}' > .env
          grep -v '^DOCKER_IMAGE=' .env > .env.tmp && mv .env.tmp .env
          echo "DOCKER_IMAGE=${{ needs.build-and-push.outputs.image_lower }}:latest" >> .env

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart stack
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Prune dangling images
        run: docker image prune -f
