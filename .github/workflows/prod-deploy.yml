name: PROD-DEPLOY

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lower: ${{ steps.meta.outputs.image_lower }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR must be lowercase)
        id: meta
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image_lower=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_lower }}:latest
            ${{ steps.meta.outputs.image_lower }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vm-deploy:
    name: Deploy on VM
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ""
    steps:
      - uses: actions/checkout@v4

      - name: Create env file and set image
        run: |
          echo '${{ secrets.PROD_ENV_FILE }}' > .env
          grep -v '^DOCKER_IMAGE=' .env > .env.tmp && mv .env.tmp .env
          echo "DOCKER_IMAGE=${{ needs.build-and-push.outputs.image_lower }}:latest" >> .env
          if ! grep -q '^HOST_PORT=' .env; then
            echo "HOST_PORT=8080" >> .env
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart stack
        run: |
          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            echo "Neither 'docker compose' nor 'docker-compose' is available on this runner."
            exit 1
          fi

          HOST_PORT=$(awk -F= '/^HOST_PORT=/{print $2}' .env | tail -n1)
          HOST_PORT=${HOST_PORT:-8080}

          # Avoid deploy failure when the host port is already bound by old/manual containers.
          CONFLICTING_CONTAINERS=$(docker ps --format "{{.ID}} {{.Ports}}" | awk -v p="$HOST_PORT" '$0 ~ ("0\\.0\\.0\\.0:" p "->") || $0 ~ ("\\[::\\]:" p "->") {print $1}')
          if [ -n "$CONFLICTING_CONTAINERS" ]; then
            echo "Stopping containers using host port $HOST_PORT: $CONFLICTING_CONTAINERS"
            docker stop $CONFLICTING_CONTAINERS || true
            docker rm $CONFLICTING_CONTAINERS || true
          fi

          # Remove stale container with the same fixed name used by compose.
          docker rm -f rdf-site >/dev/null 2>&1 || true

          # Ensure previous stack state is cleaned before recreating.
          $COMPOSE_CMD -f docker-compose.prod.yml down --remove-orphans || true

          $COMPOSE_CMD -f docker-compose.prod.yml pull
          $COMPOSE_CMD -f docker-compose.prod.yml up -d --remove-orphans

      - name: Prune dangling images
        run: docker image prune -f
